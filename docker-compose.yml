services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: redscope
      POSTGRES_USER: redscope
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redscope"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Scan Runner: the ONLY service with Docker daemon access.
  # Backend and Celery worker call its HTTP API to run scan containers.
  # This architectural isolation means backend compromise does NOT give Docker access.
  scan-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.scanner
    environment:
      SCAN_OUTPUT_DIR: /app/output
      RUNNER_SECRET: ${RUNNER_SECRET:-redscope-runner-secret}
      ALLOWED_IMAGES: "instrumentisto/nmap,projectdiscovery/nuclei,projectdiscovery/subfinder,projectdiscovery/httpx,paoloo/sqlmap,cyal1/dirsearch,ghcr.io/zan8in/afrog,shadowlianmc/fscan,lnxbil/whatweb,ekultek/wafw00f,ffuf/ffuf"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - scan_output:/app/output
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+asyncpg://redscope:${DB_PASSWORD}@db:5432/redscope
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SCAN_RUNNER_URL: http://scan-runner:9090
      RUNNER_SECRET: ${RUNNER_SECRET:-redscope-runner-secret}
    volumes:
      - scan_output:/app/output
      - ./plugins:/app/plugins
      - ./pipelines:/app/pipelines:ro
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      scan-runner:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A backend.tasks.celery_app worker -l info -c 4
    environment:
      DATABASE_URL: postgresql+asyncpg://redscope:${DB_PASSWORD}@db:5432/redscope
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SCAN_RUNNER_URL: http://scan-runner:9090
      RUNNER_SECRET: ${RUNNER_SECRET:-redscope-runner-secret}
    volumes:
      - scan_output:/app/output  # rw needed for _run_local fallback; Docker scans go through scan-runner
      - ./plugins:/app/plugins:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      scan-runner:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  scan_output:
