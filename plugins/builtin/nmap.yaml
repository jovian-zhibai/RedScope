plugin:
  name: nmap
  display_name: "Nmap"
  version: "7.95"
  description: "网络端口扫描与服务识别"
  category: recon
  language: C

  docker:
    image: "instrumentisto/nmap:7.95"

  inputs:
    - name: target
      type: string
      required: true
      description: "扫描目标 (IP/域名/CIDR)"
    - name: ports
      type: string
      required: false
      default: "1-10000"
      description: "端口范围"
    - name: scan_type
      type: select
      options: ["-sS", "-sT", "-sV", "-A", "-sn"]
      default: "-sS"
      description: "扫描类型"
    - name: extra_args
      type: string
      required: false
      description: "额外参数"

  command: "nmap {scan_type} -p {ports} {extra_args} -oX /output/result.xml {target}"

  output:
    format: xml
    path: "/output/result.xml"
    parser: "parsers/builtin/nmap_parser.py"

  provides:
    - open_ports
    - service_info
    - os_detection

  proxy:
    supported: true
    flag: "--proxies socks4://{proxy_url}"
